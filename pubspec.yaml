name: Build Yuopni APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Decode Keystore
        run: |
          base64 --decode android/app/keystore.b64 > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storeFile=upload-keystore.jks" > android/app/key.properties
          echo "storePassword=yuopni123" >> android/app/key.properties
          echo "keyPassword=yuopni123" >> android/app/key.properties
          echo "keyAlias=yuopni" >> android/app/key.properties
          cp android/app/key.properties android/key.properties

      - name: Full Clean
        run: |
          flutter clean
          rm -rf ~/.pub-cache
          rm -rf build/
          rm -rf android/.gradle
          rm -rf android/app/build

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuopni-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7