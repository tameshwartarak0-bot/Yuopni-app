publish_to: 'none'
version: 1.0.5+6
environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.0
  google_sign_in: ^6.3.0
  google_sign_in_android: ^6.2.1
  google_sign_in_ios: ^5.7.5
  image_picker: ^1.0.7
  shared_preferences: ^2.2.3
  http: ^1.1.0
  just_audio: ^0.9.36
  video_player: ^2.7.2
  camera: ^0.10.5+9
  permission_handler: ^11.3.1
  cached_network_image: ^3.3.0
  share_plus: ^8.0.0
  firebase_storage: ^11.6.0
  flutter_local_notifications: ^17.1.2
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true