name: Build Yuopni APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Decode Keystore
        run: |
          if [ ! -f android/app/keystore.b64 ]; then
            echo "keystore.b64 nahi mila! android/app/ me hona chahiye"
            exit 1
          fi
          base64 --decode android/app/keystore.b64 > android/app/upload-keystore.jks
          ls -lh android/app/*.jks

      - name: Create key.properties
        run: |
          echo "storeFile=upload-keystore.jks" > android/app/key.properties
          echo "storePassword=yuopni123" >> android/app/key.properties
          echo "keyPassword=yuopni123" >> android/app/key.properties
          echo "keyAlias=yuopni" >> android/app/key.properties
          cp android/app/key.properties android/key.properties

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - name: Verify APK Signature
        run: |
          ls -lh build/app/outputs/flutter-apk/
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "Verifying $apk"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuopni-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          compression-level: 6
          retention-days: 7