name: Build Yuopni APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      - name: Decode Keystore
        run: |
          base64 --decode android/app/keystore.b64 > android/app/upload-keystore.jks
          ls -lh android/app/*.jks
      - name: Create key.properties
        run: |
          echo "storePassword=yuopni123" > android/key.properties
          echo "keyPassword=yuopni123" >> android/key.properties
          echo "keyAlias=yuopni" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuopni-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7