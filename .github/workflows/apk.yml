name: Build Yuopni APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Decode Keystore
        run: |
          if [ ! -f android/app/keystore.b64 ]; then
            echo "keystore.b64 nahi mila! android/app/ me hona chahiye"
            exit 1
          fi
          base64 --decode android/app/keystore.b64 > android/app/upload-keystore.jks
          ls -lh android/app/*.jks
          echo "Keystore size: $(wc -c < android/app/upload-keystore.jks) bytes"

      - name: Create key.properties
        run: |
          # FIX: storeFile ka path sahi karo - app/ folder ke andar hai
          echo "storeFile=upload-keystore.jks" > android/app/key.properties
          echo "storePassword=yuopni123" >> android/app/key.properties
          echo "keyPassword=yuopni123" >> android/app/key.properties
          echo "keyAlias=yuopni" >> android/app/key.properties
          cat android/app/key.properties
          # android/ me bhi copy karo backup ke liye
          cp android/app/key.properties android/key.properties

      - run: flutter pub get
      - run: flutter build apk --release -v

      - name: Verify APK Signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuopni-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0
          retention-days: 7