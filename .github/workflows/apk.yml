name: Build Yuopni APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      - name: Decode Keystore
        run: |
          base64 --decode android/app/keystore.b64 > android/app/upload-keystore.jks
          ls -lh android/app/*.jks
      - name: Create key.properties
        run: |
          echo "storePassword=yuopni123" > android/key.properties
          echo "keyPassword=yuopni123" >> android/key.properties
          echo "keyAlias=yuopni" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuopni-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

      # --- AUTO DELETE: Sirf 3 APK rakhega ---
      - name: Keep last 3 APKs, delete old
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner, repo,
              per_page: 100
            });
            let arts = data.artifacts.filter(a => a.name.startsWith('yuopni-apk-'));
            arts.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            console.log(`Total APKs: ${arts.length}`);
            const toDelete = arts.slice(3);
            for (const art of toDelete) {
              console.log(`Deleting old: ${art.name}`);
              await github.rest.actions.deleteArtifact({
                owner, repo,
                artifact_id: art.id
              });
            }

      # --- OPTIONAL: Purane workflow runs bhi delete ---
      - name: Keep last 10 workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo,
              workflow_id: 'apk.yml',
              per_page: 100
            });
            runs.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = runs.slice(10);
            for (const run of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner, repo,
                  run_id: run.id
                });
              } catch(e) {}
            }