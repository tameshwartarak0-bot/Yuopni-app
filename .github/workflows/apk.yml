name: Build Yuopni APK
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Decode Keystore
        run: |
          base64 --decode android/app/keystore.b64 > android/app/upload-keystore.jks
          ls -lh android/app/*.jks

      - name: Create key.properties
        run: |
          echo "storePassword=yuopni123" > android/key.properties
          echo "keyPassword=yuopni123" >> android/key.properties
          echo "keyAlias=yuopni" >> android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> android/key.properties
          cat android/key.properties

      - name: Show SHA1
        run: keytool -list -v -keystore android/app/upload-keystore.jks -alias yuopni -storepass yuopni123 | grep SHA1

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      # Sirf arm64 upload hoga - 83 MB ki jagah 28 MB
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuopni-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

      # Purane builds delete - sirf last 4 rakhega
      - name: Delete old builds - Keep only last 4
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 4