<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuopni - Watch Reel</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.box{padding:24px;max-width:400px}
h1{font-size:32px;margin-bottom:10px}
p{color:#aaa}
.btn{display:inline-block;margin-top:20px;padding:14px 28px;background:#ff3a5e;color:#fff;border-radius:30px;text-decoration:none;font-weight:bold;font-size:16px}
.small{margin-top:20px;display:block;color:#666;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h1>Yuopni 🔥</h1>
<p id="msg">Ye amazing reel dekhne ke liye app open karo</p>
<a class="btn" id="openBtn" href="#">Open in Yuopni App</a>
<a class="small" href="#">Play Store se Download karo</a>
<p style="margin-top:30px;font-size:12px;color:#444" id="idText"></p>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(id){
    document.getElementById('idText').innerText = "Video ID: " + id;
    document.getElementById('msg').innerText = "Ye Reel dekhne ke liye Yuopni App install karo";
    document.getElementById('openBtn').href = "https://yuopni-1c5e9.web.app/video?id=" + id;
  } else {
    document.getElementById('msg').innerText = "Welcome to Yuopni - India's Trending Short Video App";
  }
</script>
</body>
</html>
