<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Yuopni - Watch Reel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:row}
.left{flex:1;display:flex;align-items:center;justify-content:center;background:#000;min-height:60vh}
.left video{width:auto;max-width:100%;max-height:90vh;background:#000}
.right{width:380px;background:#121212;padding:20px;border-left:1px solid #222;display:flex;flex-direction:column}
@media(max-width:800px){.wrap{flex-direction:column}.right{width:100%;border:none}.left{min-height:50vh}}
.user{display:flex;gap:10px;align-items:center;margin:15px 0}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf);display:flex;align-items:center;justify-content:center;font-weight:bold}
.btn{background:#ff2d55;color:#fff;padding:14px;border-radius:30px;text-align:center;text-decoration:none;font-weight:bold;margin-top:20px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="wrap">
<div class="left">
<video id="v" controls autoplay loop playsinline style="display:none"></video>
<p id="load">Loading Yuopni Reel...</p>
</div>
<div class="right">
<h1>Yuopni 🔥</h1>
<div class="user"><div class="av" id="av">Y</div><div><b id="name">Loading...</b><div style="font-size:12px;color:#888">Yuopni User</div></div></div>
<p id="cap" style="font-size:14px;color:#ddd"></p>
<p id="song" style="font-size:12px;color:#aaa;margin-top:10px"></p>
<a id="openBtn" class="btn" href="#">Open in Yuopni App</a>
<p id="vid" style="font-size:10px;color:#444;margin-top:15px;word-break:break-all"></p>
</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC4y5A6NsLXusKsYly7jGdo_AByDaPcKYM",
  authDomain: "yuopni-1c5e9.firebaseapp.com",
  projectId: "yuopni-1c5e9",
  storageBucket: "yuopni-1c5e9.firebasestorage.app",
  messagingSenderId: "628684774390",
  appId: "1:628684774390:web:68287fa81995805eea85d7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const id = new URLSearchParams(location.search).get('id');
document.getElementById('vid').innerText = id? "ID: "+id : "No ID";
document.getElementById('openBtn').href = "intent://yuopni-1c5e9.web.app/video?id="+(id||'')+"#Intent;scheme=https;package=com.yuopni.yuopni;S.browser_fallback_url=https://play.google.com/store;end";
async function run(){
 if(!id){document.getElementById('load').innerText="Welcome to Yuopni";return;}
 try{
  const doc = await db.collection('posts').doc(id).get();
  if(!doc.exists){document.getElementById('load').innerText="Reel not found";return;}
  const d = doc.data();
  document.getElementById('name').innerText = d.username||"Yuopni User";
  document.getElementById('av').innerText = (d.username||"Y")[0].toUpperCase();
  document.getElementById('cap').innerText = d.title||d.caption||"";
  if(d.songName) document.getElementById('song').innerText="🎵 "+d.songName;
  const url = d.mediaUrl||d.videoUrl||"";
  const video = document.getElementById('v');
  video.src = url; video.style.display="block"; document.getElementById('load').style.display="none"; video.play().catch(()=>{});
 }catch(e){document.getElementById('load').innerText="Error: "+e.message}
}
run();
</script>
</body>
</html>
